snapshots:
  - name: snp_clients
    relation: ref('stg_berka__clients')
    description: "SCD2 history of clients, tracks district changes."
    config:
      unique_key: client_id
      strategy: timestamp
      updated_at: updated_at
      hard_deletes: new_record
      dbt_valid_to_current: "cast('9999-12-31' as timestamp)"
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - client_id
              - dbt_valid_from
      - dbt_utils.expression_is_true:
          arguments:
            expression: "dbt_valid_from < dbt_valid_to"
    columns:
      - name: client_id
        description: "Client ID (natural key)."
      - name: birth_number
        description: "Encoded birth date and gender. PII, not moved to marts."
      - name: district_id
        description: "District of the client address. Tracked column (Type 2)."
      - name: updated_at
        description: "{{ doc('updated_at') }}"
      - name: _loaded_at
        description: "{{ doc('loaded_at') }}"
      - name: dbt_scd_id
        description: "{{ doc('dbt_scd_id') }}"
        data_tests:
          - unique
          - not_null
      - name: dbt_updated_at
        description: "{{ doc('dbt_updated_at') }}"
      - name: dbt_valid_from
        description: "{{ doc('dbt_valid_from') }}"
      - name: dbt_valid_to
        description: "{{ doc('dbt_valid_to') }}"
      - name: dbt_is_deleted
        description: "{{ doc('dbt_is_deleted') }}"

  - name: snp_accounts
    relation: ref('stg_berka__accounts')
    description: "SCD2 history of accounts, tracks statement frequency changes."
    config:
      unique_key: account_id
      strategy: timestamp
      updated_at: updated_at
      hard_deletes: new_record
      dbt_valid_to_current: "cast('9999-12-31' as timestamp)"
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - account_id
              - dbt_valid_from
      - dbt_utils.expression_is_true:
          arguments:
            expression: "dbt_valid_from < dbt_valid_to"
    columns:
      - name: account_id
        description: "Account ID (natural key)."
      - name: district_id
        description: "District of the bank branch."
      - name: frequency
        description: "Statement frequency (monthly, weekly, after_transaction). Tracked column (Type 2)."
      - name: created_date
        description: "Account creation date."
      - name: updated_at
        description: "{{ doc('updated_at') }}"
      - name: _loaded_at
        description: "{{ doc('loaded_at') }}"
      - name: dbt_scd_id
        description: "{{ doc('dbt_scd_id') }}"
        data_tests:
          - unique
          - not_null
      - name: dbt_updated_at
        description: "{{ doc('dbt_updated_at') }}"
      - name: dbt_valid_from
        description: "{{ doc('dbt_valid_from') }}"
      - name: dbt_valid_to
        description: "{{ doc('dbt_valid_to') }}"
      - name: dbt_is_deleted
        description: "{{ doc('dbt_is_deleted') }}"

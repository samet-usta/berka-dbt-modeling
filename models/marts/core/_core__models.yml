version: 2

models:
  - name: dim_date
    description: "Date dimension. One row per day from dim_date_start to dim_date_end."
    columns:
      - name: date_key
        description: "Smart key in YYYYMMDD format (integer)."
        data_tests:
          - unique
          - not_null
      - name: date_day
        description: "Calendar date."
      - name: year
        description: "Calendar year."
      - name: quarter
        description: "Quarter of the year (1-4)."
      - name: month
        description: "Month number (1-12)."
      - name: month_name
        description: "Month name in English."
      - name: year_month
        description: "Year and month in YYYY-MM format."
      - name: day_of_month
        description: "Day of the month (1-31)."
      - name: day_of_week
        description: "ISO day of week (1 = Monday, 7 = Sunday)."
      - name: day_name
        description: "Day name in English."
      - name: is_weekend
        description: "True if the day is Saturday or Sunday."

  - name: dim_customer
    description: "Customer dimension, SCD2. One row per client version. Source: snp_clients."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - client_id
              - valid_from
      - dbt_utils.expression_is_true:
          arguments:
            expression: "valid_from < valid_to"
    columns:
      - name: customer_key
        description: "Version key. Hash of client_id and valid_from."
        data_tests:
          - unique
          - not_null
      - name: client_id
        description: "Natural key from the source. Durable key: the same for all versions."
        data_tests:
          - not_null
      - name: valid_from
        description: "Start of the version (inclusive). The first version starts at 1900-01-01."
        data_tests:
          - not_null
      - name: valid_to
        description: "End of the version (exclusive). 9999-12-31 for the current version."
        data_tests:
          - not_null
      - name: is_current
        description: "True for the current version of the client."
        data_tests:
          - not_null
      - name: gender
        description: "Client gender (male, female). Derived from birth_number. Type 1."
      - name: birth_date
        description: "Client birth date. Derived from birth_number. Type 1."
      - name: age
        description: "Client age at the reference_date var. Type 1."
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 120
              config:
                severity: warn
      - name: district_name
        description: "Name of the client district in this version. Type 2."
      - name: region
        description: "Region of the client district in this version. Type 2."
      - name: district_average_salary
        description: "Average salary in the client district in this version. Type 2."
      - name: has_card
        description: "True if the client has a card. Type 1."
      - name: card_type
        description: "Card type (classic, junior, gold). Null if no card. Type 1."
      - name: card_issued_date
        description: "Card issue date. Null if no card. Type 1."

  - name: dim_account
    description: "Account dimension, SCD2. One row per account version. Source: snp_accounts."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - account_id
              - valid_from
      - dbt_utils.expression_is_true:
          arguments:
            expression: "valid_from < valid_to"
    columns:
      - name: account_key
        description: "Version key. Hash of account_id and valid_from."
        data_tests:
          - unique
          - not_null
      - name: account_id
        description: "Natural key from the source. Durable key: the same for all versions."
        data_tests:
          - not_null
      - name: valid_from
        description: "Start of the version (inclusive). The first version starts at 1900-01-01."
        data_tests:
          - not_null
      - name: valid_to
        description: "End of the version (exclusive). 9999-12-31 for the current version."
        data_tests:
          - not_null
      - name: is_current
        description: "True for the current version of the account."
        data_tests:
          - not_null
      - name: frequency
        description: "Statement frequency (monthly, weekly, after_transaction) in this version. Type 2."
      - name: district_name
        description: "Name of the account branch district in this version. Type 2."
      - name: region
        description: "Region of the account branch district in this version. Type 2."
      - name: created_date
        description: "Account creation date. Type 1."
      - name: owner_client_id
        description: "client_id of the account owner. Shortcut for simple queries. Type 1."
      - name: disponent_count
        description: "Number of disponents (users who are not the owner). Type 1."
      - name: has_loan
        description: "True if the account has a loan. Type 1."

  - name: bridge_account_client
    description: "Bridge for the many-to-many relation between accounts and clients. One row per disposition. Uses durable keys, so it links all versions."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - account_id
              - client_id
    columns:
      - name: disposition_id
        description: "Natural key of the disposition. Grain of the table."
        data_tests:
          - unique
          - not_null
      - name: account_id
        description: "Durable key of the account. Joins to dim_account.account_id."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_account')
                field: account_id
      - name: client_id
        description: "Durable key of the client. Joins to dim_customer.client_id."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: client_id
      - name: disposition_type
        description: "Role of the client on the account (owner, disponent)."

  - name: fct_transactions
    description: "Transaction fact. One row per transaction. Incremental model."
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "amount > 0 or coalesce(purpose, '') in ('interest', 'penalty_interest')"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "signed_amount = case when transaction_type = 'credit' then amount else -amount end"
    columns:
      - name: transaction_id
        description: "Natural key of the transaction. unique_key of the incremental model."
        data_tests:
          - unique
          - not_null
      - name: account_key
        description: "Foreign key to the dim_account version valid on transaction_date (range join)."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_account')
                field: account_key
      - name: date_key
        description: "Foreign key to dim_date."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: transaction_date
        description: "Transaction date. Used by the incremental filter and the range join."
      - name: transaction_type
        description: "Transaction type (credit, debit, withdrawal)."
      - name: operation
        description: "Operation type. Null if unknown."
      - name: purpose
        description: "Purpose of the transaction. Null if unknown."
      - name: amount
        description: "Transaction amount. Positive. Zero is valid only for interest and penalty_interest."
      - name: signed_amount
        description: "Amount with sign. Credit is positive, other types are negative."
      - name: balance
        description: "Account balance after the transaction. Semi-additive: do not sum over time."
      - name: partner_bank
        description: "Bank of the partner account. External value."
      - name: partner_account
        description: "Partner account number. External value."

  - name: fct_loans
    description: "Loan fact. One row per loan. Incremental model."
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "amount > 0"
    columns:
      - name: loan_id
        description: "Natural key of the loan. unique_key of the incremental model."
        data_tests:
          - unique
          - not_null
      - name: account_key
        description: "Foreign key to the dim_account version valid on granted_date (range join)."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_account')
                field: account_key
      - name: date_key
        description: "Foreign key to dim_date. Based on granted_date."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: granted_date
        description: "Loan grant date. Used by the incremental filter and the range join."
      - name: amount
        description: "Loan amount."
      - name: duration
        description: "Loan duration in months."
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 12
                max_value: 60
              config:
                severity: warn
      - name: payments
        description: "Monthly payment amount."
      - name: loan_status
        description: "Loan status (finished_ok, finished_unpaid, running_ok, running_in_debt)."

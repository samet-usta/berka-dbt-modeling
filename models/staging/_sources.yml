version: 2

sources:
  - name: berka
    description: "Berka (PKDD'99) Czech bank data. Loaded by scripts/load_raw.py. All columns are VARCHAR except _loaded_at."
    schema: raw
    config:
      loaded_at_field: _loaded_at
      freshness:
        warn_after: {count: 24, period: hour}
        error_after: {count: 48, period: hour}
    tables:
      - name: account
        description: "Bank accounts."
        columns:
          - name: account_id
            data_tests:
              - unique
              - not_null
      - name: card
        description: "Credit cards issued to dispositions."
        columns:
          - name: card_id
            data_tests:
              - unique
              - not_null
      - name: client
        description: "Bank clients."
        columns:
          - name: client_id
            data_tests:
              - unique
              - not_null
      - name: disp
        description: "Dispositions. Links clients to accounts (owner or user)."
        columns:
          - name: disp_id
            data_tests:
              - unique
              - not_null
      - name: district
        description: "Demographic data of districts. Columns A1 to A16."
        columns:
          - name: A1
            description: "District ID (primary key)."
            data_tests:
              - unique
              - not_null
      - name: loan
        description: "Loans granted to accounts."
        columns:
          - name: loan_id
            data_tests:
              - unique
              - not_null
      - name: orders
        description: "Permanent payment orders. Source file is order.csv."
        columns:
          - name: order_id
            data_tests:
              - unique
              - not_null
      - name: trans
        description: "Account transactions."
        columns:
          - name: trans_id
            data_tests:
              - unique
              - not_null
